name: issue-26-closeout

# One-shot closeout for issue #26 (messaging.yaml checkpoint):
# at ~20:00 Vietnam time (12:55 UTC, GitHub cron drifts a few minutes)
# the workflow posts a summary comment on the issue and closes it.
# The date guard makes every later scheduled run a no-op, so the file
# can be removed any time after 2026-11-17.

on:
  schedule:
    - cron: '55 12 * * *' # 19:55 Vietnam time (UTC+7)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Post the summary but do not close the issue'
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: issue-26-closeout
  cancel-in-progress: false

jobs:
  summarize-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Run only on the scheduled date (2026-11-17)
        id: guard
        run: |
          today="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          if [ "$today" = "2026-11-17" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize and close issue #26
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: '26'
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail

          title="$(gh issue view "$ISSUE" --json title -q .title)"
          state="$(gh issue view "$ISSUE" --json state -q .state)"
          assignees="$(gh issue view "$ISSUE" --json assignees -q '[.assignees[].login] | join(", ")')"
          body="$(gh issue view "$ISSUE" --json body -q .body)"

          done_tasks="$(printf '%s' "$body" | grep -cE '^[[:space:]]*- \[[xX]\]' || true)"
          open_tasks="$(printf '%s' "$body" | grep -cE '^[[:space:]]*- \[[ ]\]' || true)"

          summary="$(mktemp)"
          {
            echo "## Scheduled closeout — #$ISSUE"
            echo ""
            echo "Auto-generated by the \`issue-26-closeout\` workflow on $GITHUB_RUN_ID at ~20:00 Vietnam time ($TODAY)."
            echo ""
            echo "- **Title:** $title"
            echo "- **State at closeout:** $state"
            echo "- **Assignees:** ${assignees:-none}"
            echo "- **Checklist:** $done_tasks done / $open_tasks still open"
            echo ""

            echo "### Linked PRs and issues"
            echo ""
            links="$(gh api "repos/$GH_REPO/issues/$ISSUE/timeline" \
              -q '.[] | select(.event == "cross-referenced") |
                  "- #\(.source.issue.number) \(.source.issue.title) (\(.source.issue.state))"' \
              | sort -u || true)"
            if [ -n "$links" ]; then
              printf '%s\n' "$links"
            else
              echo "_none recorded_"
            fi
            echo ""

            echo "### Comment log"
            echo ""
            gh issue view "$ISSUE" --json comments \
              -q '.comments[] | "**@\( .author.login )** (\( .createdAt )):", "", .body, "", "---"'
          } > "$summary"

          gh issue comment "$ISSUE" --body-file "$summary"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: summary posted, issue left open."
          else
            gh issue close "$ISSUE" --reason completed
            echo "Issue #$ISSUE summarized and closed."
          fi
