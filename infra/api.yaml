AWSTemplateFormatVersion: "2010-09-09"
Description: >
  csep-api stack (ADR-0004). HTTP API with a Cognito JWT authorizer and
  the campaign API Lambda functions. Lambdas connect to Aurora through
  the RDS Proxy exported by csep-data using IAM token auth (ADR-0005,
  issue #22): the role carries rds-db:connect on the dedicated csep_app
  Proxy database user; no DB password is stored in Lambda configuration.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ArtifactKey:
    Type: String
    Description: S3 key of the packaged backend Lambda bundle
  Handler:
    Type: String
    Default: create-campaign.handler
    Description: Exported handler of the first deployed function (POST /v1/campaigns)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the Lambda VPC attachment
  VpcId:
    Type: AWS::EC2::VPC::Id
  DbPort:
    Type: Number
    Default: 5432
  FrontendOrigin:
    Type: String
    Description: Deployed frontend origin allowed by CORS (https only, no path or trailing slash)
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'
    ConstraintDescription: Must be an https origin with no path or trailing slash, e.g. https://app.example.com

Conditions:
  AllowLocalhost: !Not [!Equals [!Ref EnvironmentName, prod]]

# W6001 (output value imports another stack's output) is expected in
# FrontendConfig below: the SPA config deliberately assembles the
# csep-auth exports. The update-ordering dependency it warns about is
# inherent to cross-stack config here — the same reason FrontendOrigin
# is a parameter in both stacks rather than an export — and the
# consumer deploy order (auth before api) is documented in
# infra/README.md.
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W6001

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub csep-api-${EnvironmentName}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !If
          - AllowLocalhost
          - [!Ref FrontendOrigin, "http://localhost:5173"]
          - [!Ref FrontendOrigin]
        AllowMethods: [GET, POST, PUT, DELETE]
        AllowHeaders: [Authorization, Content-Type]
        MaxAge: 86400

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-jwt-authorizer
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - Fn::ImportValue: csep-auth-UserPoolClientId
        Issuer:
          Fn::ImportValue: csep-auth-CognitoIssuer

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub csep-lambda-egress-${EnvironmentName}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub csep-api-lambda-role-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CsepDbConnect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                # Scope IAM auth to the Proxy's dedicated application
                # database user; the Lambda cannot authenticate as master.
                Resource:
                  - Fn::ImportValue: csep-data-DBProxyUserArn

  CreateCampaignFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub csep-create-campaign-${EnvironmentName}
      Runtime: nodejs24.x
      Handler: !Ref Handler
      MemorySize: 256
      Timeout: 10
      Architectures: [arm64]
      Role: !GetAtt ApiLambdaRole.Arn
      Code:
        # Packaged bundle lives in the csep-artifact bucket, which is
        # deployed first; only the bundle key varies per build.
        S3Bucket:
          Fn::ImportValue: csep-artifact-CodeBucketName
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          # Connection coordinates only — no password anywhere (D1).
          # The connect layer signs an IAM token per connection and
          # requires TLS (issue #22, ADR-0005).
          DB_HOST:
            Fn::ImportValue: csep-data-DBProxyEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME:
            Fn::ImportValue: csep-data-DbName
          DB_USER:
            Fn::ImportValue: csep-data-DbUsername
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref SubnetIds

  CreateCampaignIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - "arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - Region: !Ref AWS::Region
          FunctionArn: !GetAtt CreateCampaignFunction.Arn
      PayloadFormatVersion: "2.0"

  CreateCampaignRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /v1/campaigns"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub "integrations/${CreateCampaignIntegration}"

  CreateCampaignInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateCampaignFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:aws:execute-api:${Region}:${AccountId}:${ApiId}/*/POST/v1/campaigns"
        - Region: !Ref AWS::Region
          AccountId: !Ref AWS::AccountId
          ApiId: !Ref HttpApi

