AWSTemplateFormatVersion: "2010-09-09"
Description: >
  csep-observability stack.
  Provides CloudWatch logging, metric filters, alarms
  and manager email notifications for the Customer
  Support Email Campaign Platform.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ManagerEmail:
    Type: String
    Description: Email address receiving CloudWatch alarm notifications.
    AllowedPattern: ".+@.+\\..+"
  ApiId:
    Type: String
    Description: API Gateway HTTP API ID from the csep-api stack.
  MainQueueName:
    Type: String
    Description: Name of the main email processing SQS queue.
  DeadLetterQueueName:
    Type: String
    Description: Name of the email processing dead-letter queue.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch log retention period.
  DLQAlarmThreshold:
    Type: Number
    Default: 0
    Description: Alarm when DLQ messages exceed this value.
  QueueAgeThreshold:
    Type: Number
    Default: 300
    Description: Maximum permitted age of the oldest queued message in seconds.
  Api5xxThreshold:
    Type: Number
    Default: 5
    Description: Number of API 5xx errors before triggering an alarm.
  LambdaErrorThreshold:
    Type: Number
    Default: 1
  LambdaThrottleThreshold:
    Type: Number
    Default: 1

Resources:

  # NAM'S SECTION
  # MANAGER EMAIL ALERTING

  ManagerAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub csep-manager-alerts-${EnvironmentName}
      DisplayName: CSEP CloudWatch Alarm Notifications

  ManagerEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref ManagerAlertsTopic
      Endpoint: !Ref ManagerEmail

  # CLOUDWATCH LOG GROUPS

  CreateCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/lambda/csep-create-campaign-${Environment}
        - Environment: !Ref EnvironmentName
      RetentionInDays: !Ref LogRetentionDays

  # CLOUDWATCH METRIC FILTERS

  LambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateCampaignLogGroup
      FilterPattern: "ERROR"
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  AuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateCampaignLogGroup
      FilterPattern: "AUDIT"
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  # SQS QUEUE ALARMS

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-dlq-depth-${EnvironmentName}
      AlarmDescription: >
        Triggers when one or more messages enter the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref DeadLetterQueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref DLQAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-queue-age-${EnvironmentName}
      AlarmDescription: >
        Triggers when the oldest message remains in the main queue
        longer than the configured threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Ref MainQueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref QueueAgeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  # API GATEWAY ALARMS

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-api-5xx-${EnvironmentName}
      AlarmDescription: >
        Triggers when API Gateway returns too many server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiId
        - Name: Stage
          Value: "$default"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref Api5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  # LAMBDA ALARMS

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-lambda-errors-${EnvironmentName}
      AlarmDescription: >
        Triggers when the campaign Lambda reports an execution error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub csep-create-campaign-${EnvironmentName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-lambda-throttles-${EnvironmentName}
      AlarmDescription: >
        Triggers when campaign Lambda invocations are throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Sub csep-create-campaign-${EnvironmentName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref LambdaThrottleThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic



  # BACH TUNG'S SECTION





Outputs:

  ManagerAlertsTopicArn:
    Description: SNS topic ARN for manager CloudWatch notifications.
    Value: !Ref ManagerAlertsTopic
    Export:
      Name: !Sub csep-observability-ManagerAlertsTopicArn

  CreateCampaignLogGroupName:
    Description: CloudWatch log group for the campaign Lambda.
    Value: !Ref CreateCampaignLogGroup
    Export:
      Name: !Sub csep-observability-CreateCampaignLogGroupName
