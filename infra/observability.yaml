AWSTemplateFormatVersion: "2010-09-09"
Description: >
  csep-observability stack.
  Provides CloudWatch logging, metric filters, alarms
  and manager email notifications for the Customer
  Support Email Campaign Platform.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ManagerEmail:
    Type: String
    Description: Email address receiving CloudWatch alarm notifications.
    AllowedPattern: ".+@.+\\..+"
  ApiId:
    Type: String
    Description: API Gateway HTTP API ID from the csep-api stack.
  MainQueueName:
    Type: String
    Description: Name of the main email processing SQS queue.
  DeadLetterQueueName:
    Type: String
    Description: Name of the email processing dead-letter queue.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch log retention period.
  DLQAlarmThreshold:
    Type: Number
    Default: 0
    Description: Alarm when DLQ messages exceed this value.
  QueueAgeThreshold:
    Type: Number
    Default: 300
    Description: Maximum permitted age of the oldest queued message in seconds.
  Api5xxThreshold:
    Type: Number
    Default: 5
    Description: Number of API 5xx errors before triggering an alarm.
  LambdaErrorThreshold:
    Type: Number
    Default: 1
  LambdaThrottleThreshold:
    Type: Number
    Default: 1

Resources:

  # NAM'S SECTION
  # MANAGER EMAIL ALERTING

  ManagerAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub csep-manager-alerts-${EnvironmentName}
      DisplayName: CSEP CloudWatch Alarm Notifications

  ManagerEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref ManagerAlertsTopic
      Endpoint: !Ref ManagerEmail

  # CLOUDWATCH LOG GROUPS
  # Explicit groups prevent Lambda from creating unbounded-retention defaults.

  CreateCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-create-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ListCampaignsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-list-campaigns-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  GetCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-get-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  UpdateCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-update-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  DeleteCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-delete-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ScheduleCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-schedule-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  SendCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-send-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  CancelCampaignLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-cancel-campaign-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ListCampaignLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-list-campaign-logs-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ListTemplatesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-list-templates-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  CreateTemplateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-create-template-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  GetTemplateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-get-template-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  UpdateTemplateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-update-template-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  DeleteTemplateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-delete-template-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ListSegmentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-list-segments-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  CreateSegmentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-create-segment-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  PreviewSegmentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-preview-segment-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  GetCustomerPreferencesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-get-customer-preferences-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  UpdateCustomerPreferencesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-update-customer-preferences-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  ListAuditLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-list-audit-logs-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-dispatcher-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  EventHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-event-handler-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/csep-worker-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionDays

  # CLOUDWATCH METRIC FILTERS
  # The ERROR pattern is retained from the existing template. Confirm that the
  # application logs emit this term as a standalone/searchable log token.

  LambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  ListCampaignsLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListCampaignsLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  GetCampaignLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref GetCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  UpdateCampaignLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref UpdateCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  DeleteCampaignLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeleteCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  ScheduleCampaignLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ScheduleCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  SendCampaignLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SendCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  CancelCampaignLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CancelCampaignLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  ListCampaignLogsLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListCampaignLogsLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  ListTemplatesLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListTemplatesLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  CreateTemplateLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateTemplateLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  GetTemplateLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref GetTemplateLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  UpdateTemplateLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref UpdateTemplateLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  DeleteTemplateLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeleteTemplateLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  ListSegmentsLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListSegmentsLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  CreateSegmentLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateSegmentLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  PreviewSegmentLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref PreviewSegmentLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  GetCustomerPreferencesLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref GetCustomerPreferencesLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  UpdateCustomerPreferencesLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref UpdateCustomerPreferencesLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  ListAuditLogsLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ListAuditLogsLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  DispatcherLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatcherLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  EventHandlerLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EventHandlerLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  WorkerLambdaErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: LambdaErrors
          MetricValue: "1"
          DefaultValue: 0

  # AUDIT FILTERS
  # Limited to user-initiated actions listed in the audit strategy.
  # Automated dispatcher/worker/SES event processing is not counted as an audit event.

  AuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateCampaignLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  UpdateCampaignAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref UpdateCampaignLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  DeleteCampaignAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeleteCampaignLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  ScheduleCampaignAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ScheduleCampaignLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  SendCampaignAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SendCampaignLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  CancelCampaignAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CancelCampaignLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  CreateTemplateAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CreateTemplateLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  UpdateTemplateAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref UpdateTemplateLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  DeleteTemplateAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeleteTemplateLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  UpdateCustomerPreferencesAuditEventMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref UpdateCustomerPreferencesLogGroup
      FilterPattern: 'AUDIT'
      MetricTransformations:
        - MetricNamespace: CSEP/Application
          MetricName: AuditEvents
          MetricValue: "1"
          DefaultValue: 0

  # SQS QUEUE ALARMS

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-dlq-depth-${EnvironmentName}
      AlarmDescription: >
        Triggers when one or more messages enter the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref DeadLetterQueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref DLQAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-queue-age-${EnvironmentName}
      AlarmDescription: >
        Triggers when the oldest message remains in the main queue
        longer than the configured threshold.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Ref MainQueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref QueueAgeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  # API GATEWAY ALARMS

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-api-5xx-${EnvironmentName}
      AlarmDescription: >
        Triggers when API Gateway returns too many server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiId
        - Name: Stage
          Value: "$default"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref Api5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  # LAMBDA ALARMS

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-lambda-errors-${EnvironmentName}
      AlarmDescription: >
        Triggers when the create-campaign Lambda reports an execution error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub csep-create-campaign-${EnvironmentName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref LambdaErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub csep-lambda-throttles-${EnvironmentName}
      AlarmDescription: >
        Triggers when campaign Lambda invocations are throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Sub csep-create-campaign-${EnvironmentName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref LambdaThrottleThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerAlertsTopic

  # CLOUDWATCH DASHBOARD (issue #28)
  # One dashboard that shows campaign health: emails sent / delivered /
  # bounced / complaints (SES), queue depth, API latency + 5xx, Lambda
  # errors, and the status of Nam's alarms above. It only READS existing
  # metrics, so it needs no new parameters and cannot break the alarms.

  CampaignHealthDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub csep-campaign-health-${EnvironmentName}
      DashboardBody: !Sub |
        {"start": "-PT6H", "periodOverride": "auto", "widgets": [
          {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown": "# CSEP campaign health (${EnvironmentName})\nEmail sending (SES), queues, API and Lambda in one place. Red lines are the ones that should stay at 0. SES numbers are for the whole AWS account; per-campaign numbers come from the Statistics API."}},
          {"type": "metric", "x": 0, "y": 2, "width": 24, "height": 3, "properties": {"title": "Emails in the selected time range", "view": "singleValue", "region": "${AWS::Region}", "stat": "Sum", "setPeriodToTimeRange": true, "sparkline": false, "metrics": [["AWS/SES", "Send", {"label": "Sent"}], ["AWS/SES", "Delivery", {"label": "Delivered"}], ["AWS/SES", "Bounce", {"label": "Bounced"}], ["AWS/SES", "Complaint", {"label": "Complaints"}]]}},
          {"type": "metric", "x": 0, "y": 5, "width": 12, "height": 6, "properties": {"title": "Sent / delivered / bounce / complaint", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Sum", "period": 300, "metrics": [["AWS/SES", "Send", {"label": "Sent"}], ["AWS/SES", "Delivery", {"label": "Delivered"}], ["AWS/SES", "Bounce", {"label": "Bounced", "color": "#d62728"}], ["AWS/SES", "Complaint", {"label": "Complaints", "color": "#8c564b"}]]}},
          {"type": "metric", "x": 12, "y": 5, "width": 12, "height": 6, "properties": {"title": "SES sender reputation (rates)", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Average", "period": 300, "metrics": [["AWS/SES", "Reputation.BounceRate", {"label": "Bounce rate", "color": "#d62728"}], ["AWS/SES", "Reputation.ComplaintRate", {"label": "Complaint rate", "color": "#8c564b"}]]}},
          {"type": "metric", "x": 0, "y": 11, "width": 12, "height": 6, "properties": {"title": "Queue depth", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${MainQueueName}", {"label": "Main queue - waiting"}], ["AWS/SQS", "ApproximateNumberOfMessagesNotVisible", "QueueName", "${MainQueueName}", {"label": "Main queue - being processed"}], ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DeadLetterQueueName}", {"label": "Dead-letter queue", "color": "#d62728"}]]}},
          {"type": "metric", "x": 12, "y": 11, "width": 12, "height": 6, "properties": {"title": "Age of oldest message (seconds)", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "metrics": [["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${MainQueueName}", {"label": "Main queue"}], ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${DeadLetterQueueName}", {"label": "Dead-letter queue", "color": "#d62728"}]]}},
          {"type": "metric", "x": 0, "y": 17, "width": 12, "height": 6, "properties": {"title": "API latency (ms)", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Average", "period": 60, "metrics": [["AWS/ApiGateway", "Latency", "ApiId", "${ApiId}", "Stage", "$default", {"label": "Average", "stat": "Average"}], ["AWS/ApiGateway", "Latency", "ApiId", "${ApiId}", "Stage", "$default", {"label": "p95", "stat": "p95"}], ["AWS/ApiGateway", "Latency", "ApiId", "${ApiId}", "Stage", "$default", {"label": "p99", "stat": "p99"}]]}},
          {"type": "metric", "x": 12, "y": 17, "width": 12, "height": 6, "properties": {"title": "API requests and errors", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Sum", "period": 60, "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${ApiId}", "Stage", "$default", {"label": "Requests"}], ["AWS/ApiGateway", "4xx", "ApiId", "${ApiId}", "Stage", "$default", {"label": "4xx (client errors)", "color": "#ff7f0e"}], ["AWS/ApiGateway", "5xx", "ApiId", "${ApiId}", "Stage", "$default", {"label": "5xx (server errors)", "color": "#d62728"}]]}},
          {"type": "metric", "x": 0, "y": 23, "width": 12, "height": 6, "properties": {"title": "Campaign Lambda: invocations, errors, throttles", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Sum", "period": 60, "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "csep-create-campaign-${EnvironmentName}", {"label": "Invocations"}], ["AWS/Lambda", "Errors", "FunctionName", "csep-create-campaign-${EnvironmentName}", {"label": "Errors", "color": "#d62728"}], ["AWS/Lambda", "Throttles", "FunctionName", "csep-create-campaign-${EnvironmentName}", {"label": "Throttles", "color": "#ff7f0e"}]]}},
          {"type": "metric", "x": 12, "y": 23, "width": 12, "height": 6, "properties": {"title": "Campaign Lambda: duration (ms)", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Average", "period": 60, "metrics": [["AWS/Lambda", "Duration", "FunctionName", "csep-create-campaign-${EnvironmentName}", {"label": "Average", "stat": "Average"}], ["AWS/Lambda", "Duration", "FunctionName", "csep-create-campaign-${EnvironmentName}", {"label": "p95", "stat": "p95"}]]}},
          {"type": "metric", "x": 0, "y": 29, "width": 12, "height": 6, "properties": {"title": "Application log metrics (from log filters)", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "stat": "Sum", "period": 60, "metrics": [["CSEP/Application", "LambdaErrors", {"label": "ERROR log lines", "color": "#d62728"}], ["CSEP/Application", "AuditEvents", {"label": "AUDIT log lines"}]]}},
          {"type": "alarm", "x": 12, "y": 29, "width": 12, "height": 6, "properties": {"title": "Alarm status", "alarms": ["${DLQDepthAlarm.Arn}", "${QueueAgeAlarm.Arn}", "${Api5xxAlarm.Arn}", "${LambdaErrorsAlarm.Arn}", "${LambdaThrottlesAlarm.Arn}"]}}
        ]}

Outputs:

  ManagerAlertsTopicArn:
    Description: SNS topic ARN for manager CloudWatch notifications.
    Value: !Ref ManagerAlertsTopic
    Export:
      Name: !Sub csep-observability-ManagerAlertsTopicArn

  CreateCampaignLogGroupName:
    Description: CloudWatch log group for the campaign Lambda.
    Value: !Ref CreateCampaignLogGroup
    Export:
      Name: !Sub csep-observability-CreateCampaignLogGroupName

  CampaignHealthDashboardName:
    Description: CloudWatch dashboard for campaign health (open it in the CloudWatch console).
    Value: !Ref CampaignHealthDashboard
    Export:
      Name: csep-observability-CampaignHealthDashboardName
