AWSTemplateFormatVersion: "2010-09-09"
Description: >
  csep-data stack (ADR-0004). Provisions the Aurora Serverless v2
  PostgreSQL cluster and the RDS Proxy that sits in front of it
  (ADR-0005). API clients authenticate to the Proxy with IAM tokens
  as a dedicated application user; the Proxy uses that user's
  Secrets Manager credential to authenticate to Aurora. The master
  credential is reserved for one-off schema bootstrap.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC hosting the database
  VpcCidrBlock:
    Type: String
    Description: CIDR of VpcId; used to allow in-VPC clients to reach the Proxy
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two private subnets in different Availability Zones
  DbName:
    Type: String
    Default: csep
  MasterDbUsername:
    Type: String
    Default: csepadmin
    Description: Administrative bootstrap user; password is managed by Secrets Manager.
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
  BootstrapSecurityGroupId:
    Type: String
    Default: ""
    Description: Optional temporary SSM host security group; clear after schema and app-user bootstrap.
    AllowedPattern: "^(sg-[0-9a-f]{8,17})?$"
  MinACU:
    Type: Number
    Default: 2
    MinValue: 0.5
    MaxValue: 128
  MaxACU:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 128
  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set true for shared/demo stacks. Must be false for stack teardown (ADR-0004 cost control).

Conditions:
  HasBootstrapSecurityGroup: !Not [!Equals [!Ref BootstrapSecurityGroupId, ""]]

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the csep Aurora cluster and RDS Proxy
      SubnetIds: !Ref SubnetIds

  # Proxy accepts in-VPC clients; direct cluster access is limited to
  # the Proxy and, temporarily, the one-off SSM bootstrap host.
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub csep-proxy-ingress-${EnvironmentName}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidrBlock

  # The cluster normally accepts connections only from the Proxy.
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub csep-aurora-ingress-${EnvironmentName}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt ProxySecurityGroup.GroupId
        - !If
          - HasBootstrapSecurityGroup
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref BootstrapSecurityGroupId
          - !Ref AWS::NoValue

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "15.12"
      EngineMode: provisioned # Serverless v2 is provisioned mode + scaling config
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinACU
        MaxCapacity: !Ref MaxACU
      DatabaseName: !Ref DbName
      MasterUsername: !Ref MasterDbUsername
      # D2 (issue #22): the master password is generated, stored and
      # rotatable by Secrets Manager — never printed or echoed.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt ClusterSecurityGroup.GroupId
      StorageEncrypted: true
      DeletionProtection: !Ref DeletionProtection
      BackupRetentionPeriod: 7

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false

  ApplicationDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "csep/${EnvironmentName}/application-db"
      Description: Password for the dedicated csep_app application database role
      GenerateSecretString:
        SecretStringTemplate: '{"username":"csep_app"}'
        GenerateStringKey: password
        PasswordLength: 32

  # Lets the Proxy read only the application credential from Secrets Manager.
  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub csep-proxy-role-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CsepProxySecretAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref ApplicationDbSecret
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                # Needed when the secret uses the default KMS key.
                # Tighten to the specific key ARN once known.

  CampaignDBProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub csep-proxy-${EnvironmentName}
      EngineFamily: POSTGRESQL
      # Clients authenticate as the dedicated application user with
      # IAM tokens; the Proxy uses its managed secret to reach Aurora.
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref ApplicationDbSecret
          IAMAuth: REQUIRED
      RequireTLS: true
      RoleArn: !GetAtt ProxyRole.Arn
      VpcSecurityGroupIds:
        - !GetAtt ProxySecurityGroup.GroupId
      VpcSubnetIds: !Ref SubnetIds
      IdleClientTimeout: 600

  ProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref CampaignDBProxy
      TargetGroupName: default
      DBClusterIdentifiers:
        - !Ref AuroraCluster
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 80
        ConnectionBorrowTimeout: 120

Outputs:
  DBProxyEndpoint:
    Description: Hostname Lambdas connect to (with IAM auth + TLS)
    Value: !GetAtt CampaignDBProxy.Endpoint
    Export:
      Name: csep-data-DBProxyEndpoint
  DBProxyArn:
    Description: RDS Proxy ARN
    Value: !GetAtt CampaignDBProxy.DBProxyArn
    Export:
      Name: csep-data-DBProxyArn
  DBProxyUserArn:
    Description: IAM database-user resource ARN for the dedicated application user
    Value: !Sub
      - "arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyResourceId}/csep_app"
      - ProxyResourceId: !Select
          - 1
          - !Split
            - "db-proxy:"
            - !GetAtt CampaignDBProxy.DBProxyArn
    Export:
      Name: csep-data-DBProxyUserArn
  ClusterWriterEndpoint:
    Description: Writer endpoint for bootstrap only; applications use the Proxy
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: csep-data-ClusterWriterEndpoint
  DBSecretArn:
    Description: Secrets Manager entry holding the administrative master credential
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
    Export:
      Name: csep-data-DBSecretArn
  DBAppSecretArn:
    Description: Generated application-user password used by the Proxy
    Value: !Ref ApplicationDbSecret
    Export:
      Name: csep-data-DBAppSecretArn
  DbName:
    Value: !Ref DbName
    Export:
      Name: csep-data-DbName
  DbUsername:
    Description: Application database username expected by the API
    Value: csep_app
    Export:
      Name: csep-data-DbUsername
